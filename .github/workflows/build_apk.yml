name: Build APK

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Which build type to assemble"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ github.event.inputs.buildType || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `workflow_dispatch` supplies the choice; a `push` has no inputs, so default to debug.
      BUILD_TYPE: ${{ github.event.inputs.buildType || 'debug' }}
    steps:
      # A plain checkout is enough: the build only runs `git rev-parse HEAD` for the commit hash.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # JDK setup mirrors tests_unit.yml / compare_apk_size.yml.
      # The Gradle daemon JVM is pinned by gradle/gradle-daemon-jvm.properties
      # (toolchainVendor=JETBRAINS, toolchainVersion=21) and the root build.gradle.kts
      # ANKIDROID_JVM guard rejects a mismatched daemon, so distribution/java-version
      # must stay "jetbrains"/"21".
      - name: Configure JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "jetbrains"
          java-version: "21"  # also change jitpack.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        timeout-minutes: 10
        with:
          # Use open source provider: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md#basic-caching
          cache-provider: basic
          # Only write to the cache for builds on the 'main' branches, stops branches evicting main cache
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `full` is the flavour distributed on GitHub/F-Droid: no Google Play Services
      # dependency, no storage/camera restrictions - the right choice for GrapheneOS.
      #
      # debug:   `splits.abi.universalApk = true` is always on for the debug build type,
      #          so this produces the per-ABI APKs (incl. arm64-v8a) *and* a universal APK.
      #          The debug build type also sets `applicationIdSuffix ".debug"`, so the
      #          resulting APK installs side-by-side with a Play/F-Droid AnkiDroid
      #          (different application id) instead of conflicting with it.
      # release: needs `-Duniversal-apk=true` to additionally emit the universal APK
      #          alongside the per-ABI splits. It is signed with the checked-in
      #          tools/fallback-release-keystore.jks unless KEYSTOREPATH & co are set.
      #
      # Wrapped in a retry, as elsewhere in this repo, so a flaky dependency download
      # does not fail the whole build.
      - name: Assemble APK
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 45
          retry_wait_seconds: 60
          max_attempts: 2
          command: |
            if [ "$BUILD_TYPE" = "release" ]; then
              ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true --daemon
            else
              ./gradlew :AnkiDroid:assembleFullDebug --daemon
            fi

      # Uploads every APK the build produced: the arm64-v8a split and the universal APK
      # (plus the other ABI splits) all live under AnkiDroid/build/outputs/apk/.
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ankidroid-apk
          path: AnkiDroid/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: List produced APKs
        if: always()
        run: find AnkiDroid/build/outputs/apk -name '*.apk' -exec ls -la {} +
